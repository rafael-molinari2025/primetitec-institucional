<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="80" rx="12" fill="#060612"/>

  <!-- Hexagon mark -->
  <polygon points="38,8 58,19 58,41 38,52 18,41 18,19"
           fill="none" stroke="#00d4ff" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Circuit nodes -->
  <line x1="38" y1="8"  x2="38" y2="4"  stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="58" y1="19" x2="62" y2="16" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="58" y1="41" x2="62" y2="44" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="18" y1="19" x2="14" y2="16" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="38" cy="4"  r="3" fill="#00d4ff" opacity="0.9"/>
  <circle cx="62" cy="16" r="3" fill="#00d4ff" opacity="0.7"/>
  <circle cx="62" cy="44" r="3" fill="#00d4ff" opacity="0.6"/>
  <circle cx="14" cy="16" r="3" fill="#00d4ff" opacity="0.5"/>

  <!-- TI text inside hex -->
  <text x="38" y="36" text-anchor="middle"
        font-family="Arial Black, sans-serif" font-weight="900"
        font-size="16" fill="#00d4ff" filter="url(#glow)">TI</text>

  <!-- Wordmark -->
  <text x="76" y="44"
        font-family="Orbitron, Arial Black, sans-serif"
        font-weight="700" font-size="30" fill="white">Prime</text>
  <text x="194" y="44"
        font-family="Orbitron, Arial Black, sans-serif"
        font-weight="700" font-size="30" fill="url(#cyanGrad)">TI</text>

  <!-- Tagline -->
  <text x="76" y="62"
        font-family="Inter, Arial, sans-serif"
        font-size="11" fill="#4a5568" letter-spacing="4.5">TECNOLOGIA</text>

  <!-- Accent line -->
  <line x1="76" y1="50" x2="240" y2="50" stroke="url(#cyanGrad)" stroke-width="0.8" opacity="0.3"/>
</svg>
